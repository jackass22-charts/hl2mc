name: Build HL2-MC

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download the VS2022-ready Source SDK 2013
        shell: pwsh
        run: git clone --depth 1 https://github.com/Source-SDK-Resources/source-sdk-vs2022.git sdk

      - name: Copy the mod's code into the SDK
        shell: pwsh
        run: |
          Expand-Archive -Path hl2mc-src.zip -DestinationPath modsrc -Force
          robocopy modsrc\src sdk\sp\src /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          if (!(Test-Path sdk\sp\src\game\server\mc\mc_player.cpp)) { Write-Error "mod files missing"; exit 1 }
          exit 0

      - name: Add the registry key the project generator looks for
        shell: cmd
        run: reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\VisualStudio\10.0\Projects\{8BC9CEB8-8B4A-11D0-8D11-00A0C91BC942}" /v DefaultProjectExtension /t REG_SZ /d vcproj /f

      - name: Generate the Visual Studio projects
        shell: cmd
        working-directory: sdk\sp\src
        run: |
          call creategameprojects.bat
          if not exist games.sln exit /b 1

      - uses: microsoft/setup-msbuild@v2

      - name: Show what the generator produced
        shell: cmd
        working-directory: sdk\sp\src
        run: |
          dir /s /b *.vcxproj | findstr /v /i thirdparty
          findstr /i "Release" games.sln
          exit /b 0

      - name: Build (Release)
        shell: pwsh
        working-directory: sdk\sp\src
        run: |
          # Newer compilers add warnings Valve's 2013 code trips; the projects treat warnings as errors (/WX).
          # _CL_ is appended to every compiler command line, so /WX- turns that off without editing Valve's projects.
          $env:_CL_ = '/WX-'
          $projects = @(
            'mathlib\mathlib.vcxproj',
            'tier1\tier1.vcxproj',
            'raytrace\raytrace.vcxproj',
            'vgui2\vgui_controls\vgui_controls.vcxproj',
            'game\server\server_hl2.vcxproj',
            'game\client\client_hl2.vcxproj'
          )
          New-Item -ItemType Directory -Force $env:GITHUB_WORKSPACE\logs | Out-Null
          foreach ($p in $projects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($p)
            Write-Host "===== Building $p ====="
            msbuild $p /m /nologo /v:minimal /p:Configuration=Release /p:Platform=Win32 "/flp:logfile=$env:GITHUB_WORKSPACE\logs\$name.log;verbosity=normal"
            if ($LASTEXITCODE -ne 0) { Write-Error "Build failed: $p (see the build-logs artifact)"; exit 1 }
          }
          exit 0

      - name: Assemble the ready-to-play mod folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\hl2mc | Out-Null
          robocopy sdk\sp\game\mod_hl2 out\hl2mc /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          robocopy modsrc\mod\hl2mc out\hl2mc /E /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit 1 }
          New-Item -ItemType Directory -Force out\hl2mc\bin | Out-Null
          foreach ($dll in 'client.dll','server.dll') {
            if (!(Test-Path "out\hl2mc\bin\$dll")) {
              $found = Get-ChildItem -Recurse sdk\sp\src\game -Filter $dll -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'episodic' } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if ($found) { Copy-Item $found.FullName "out\hl2mc\bin\$dll" }
            }
            if (!(Test-Path "out\hl2mc\bin\$dll")) {
              Write-Error "$dll was not built"
              Get-ChildItem -Recurse sdk\sp -Filter *.dll | Select-Object FullName
              exit 1
            }
          }
          Get-ChildItem out\hl2mc\bin
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: hl2mc-mod-folder
          path: out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: logs
          if-no-files-found: ignore
